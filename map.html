  // ---- Route drawing using public OSRM demo server ----
  let routeLayer = null;
 
  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Earth radius in km

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

async function autoSelectNearestHospital() {

    if (hospitals.length === 0) return;

    document.getElementById("eta").textContent =
        "Finding nearest hospital...";

    // Step 1: Calculate straight-line distance
    const candidates = hospitals
        .map((h, index) => ({
            hospital: h,
            index: index,
            distance: getDistance(
                ambulance.lat,
                ambulance.lng,
                h.lat,
                h.lng
            )
        }))
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 5); // Only check the nearest 5 hospitals

    let bestIndex = -1;
    let shortestDuration = Infinity;

    // Step 2: Check driving time for only those 5
    for (const candidate of candidates) {

        const h = candidate.hospital;

        const url =
            `https://router.project-osrm.org/route/v1/driving/` +
            `${ambulance.lng},${ambulance.lat};` +
            `${h.lng},${h.lat}?overview=false`;

        try {

            const res = await fetch(url);
            const data = await res.json();

            if (data.routes && data.routes.length > 0) {

                const duration = data.routes[0].duration;

                if (duration < shortestDuration) {
                    shortestDuration = duration;
                    bestIndex = candidate.index;
                }
            }

        } catch (err) {
            console.error(err);
        }
    }

    if (bestIndex !== -1) {
        select.value = bestIndex;
        drawRoute();
    }
}

  async function drawRoute() {
    const hospital = hospitals[select.value];
    const url = `https://router.project-osrm.org/route/v1/driving/${ambulance.lng},${ambulance.lat};${hospital.lng},${hospital.lat}?overview=full&geometries=geojson`;
 
    document.getElementById('eta').textContent = "Calculating route...";
 
    try {
      const res = await fetch(url);
      const data = await res.json();
 
      if (!data.routes || data.routes.length === 0) {
        document.getElementById('eta').textContent = "No route found.";
        return;
      }
 
      const route = data.routes[0];
      const coords = route.geometry.coordinates.map(c => [c[1], c[0]]); // OSRM gives [lng,lat], Leaflet wants [lat,lng]
 
      if (routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.polyline(coords, { color: 'green', weight: 6, opacity: 0.85 }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
 
      const minutes = Math.round(route.duration / 60);
      const km = (route.distance / 1000).toFixed(1);
      document.getElementById('eta').textContent = `ETA: ${minutes} min | Distance: ${km} km`;
 
    } catch (err) {
      document.getElementById('eta').textContent = "Error fetching route.";
      console.error(err);

      // Network/OSRM failed — fall back to a straight-line estimate
      if (routeLayer) map.removeLayer(routeLayer);

      routeLayer = L.polyline(
        [[ambulance.lat, ambulance.lng], [hospital.lat, hospital.lng]],
        { color: 'red', weight: 4, opacity: 0.7, dashArray: '10, 10' }
      ).addTo(map);

      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

      const straightLineKm = getDistance(ambulance.lat, ambulance.lng, hospital.lat, hospital.lng).toFixed(1);
      document.getElementById('eta').textContent =
        `⚠️ Live routing unavailable. Approx. straight-line distance: ${straightLineKm} km`;
    }
  }
  function recenterOnAmbulance() {
      map.setView([ambulance.lat, ambulance.lng], 15);
  }
